[package]
name = "shorty"
version = "1.0.0"
edition = "2021"
authors = ["Shorty <shorty@example.com>"]
description = "Shorty — a URL shortener with Redis caching and PostgreSQL storage"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "trace", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "chrono", "migrate"] }
redis = { version = "0.25", features = ["tokio-comp", "tokio-native-tls-comp"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
thiserror = "2"

[profile.release]
# Smaller, faster binaries for production.
lto = true
codegen-units = 1
strip = true
