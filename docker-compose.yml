services:
  # PostgreSQL stores all URL mappings permanently
  # This is our source of truth — data survives restarts
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: urlshortener
    volumes:
      # This volume makes sure our data is not lost when the container stops
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - url_network

  # Redis caches the most popular URLs in memory
  # This is much faster than hitting PostgreSQL every time
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - url_network

  # The Rust app that serves the API and frontend
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      BASE_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:password@postgres:5432/urlshortener
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SECONDS: 86400
      RATE_LIMIT_MAX_REQUESTS: 10
      RATE_LIMIT_WINDOW_MS: 60000
      ANALYTICS_BATCH_SIZE: 1000
      ANALYTICS_FLUSH_INTERVAL_SECONDS: 5
      IDEMPOTENCY_KEY_TTL_SECONDS: 3600
      DATABASE_MAX_CONNECTIONS: 20
      DATABASE_ACQUIRE_TIMEOUT_SECONDS: 5
      TRUSTED_PROXY_COUNT: 0
      SHORT_CODE_SALT: 0x5f3759df
      REDIS_POOL_MAX_SIZE: 16
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - url_network

networks:
  url_network:
    driver: bridge

volumes:
  postgres_data:
